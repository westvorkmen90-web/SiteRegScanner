name: Build SiteRegScanner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - - name: Extract project
  run: |
    mkdir -p build-project
    ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
    if [ -z "$ZIP_FILE" ]; then
      echo "ERROR: ZIP project archive not found"
      exit 1
    fi
    echo "Using project archive: $ZIP_FILE"
    unzip -q "$ZIP_FILE" -d build-project
      - name: Build APK
        working-directory: build-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteRegScanner-APK
          path: build-project/app/build/outputs/apk/debug/*.apk
